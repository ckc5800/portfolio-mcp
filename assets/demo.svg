<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" font-family="'Cascadia Code', Consolas, 'D2Coding', monospace" font-size="14">
  <rect width="900" height="638" rx="10" fill="#1e1e2e"/>
  <rect width="900" height="34" rx="10" fill="#181825"/>
