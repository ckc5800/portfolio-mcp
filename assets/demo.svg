      <animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.2s" fill="freeze"/></text>

    <text x="24" y="230" font-weight="bold" opacity="0">&gt; 팝 노이즈를 어떻게 해결했어?  <tspan fill="#6c7086" font-weight="normal">(조사가 붙어도 한글 bigram으로 매칭)</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.2s" fill="freeze"/></text>
    <text x="40" y="254" fill="#89dceb" opacity="0">[tool call] portfolio_search({"query": "팝 노이즈를 어떻게 해결했어", "top_k": 1})
      <animate attributeName="opacity" from="0" to="1" begin="6.1s" dur="0.2s" fill="freeze"/></text>
    <text x="40" y="278" fill="#a6e3a1" opacity="0">→ [tts-deepdive.md] - **Frontend 잔여 버퍼(Residual Buffer) 설계**: 프론트엔드(…
      <animate attributeName="opacity" from="0" to="1" begin="7.0s" dur="0.2s" fill="freeze"/></text>

    <text x="24" y="314" font-weight="bold" opacity="0">&gt; TTS 딥다이브 문서 전문 읽어줘
      <animate attributeName="opacity" from="0" to="1" begin="8.1s" dur="0.2s" fill="freeze"/></text>
    <text x="40" y="338" fill="#b4befe" opacity="0">[resource] portfolio://docs/tts-deepdive.md
      <animate attributeName="opacity" from="0" to="1" begin="9.0s" dur="0.2s" fill="freeze"/></text>
    <text x="40" y="362" fill="#a6e3a1" opacity="0">→ 마크다운 전문 10,087자. 검색 결과가 잘렸을 때 이어 읽는 경로
      <animate attributeName="opacity" from="0" to="1" begin="9.8s" dur="0.2s" fill="freeze"/></text>

    <text x="24" y="398" font-weight="bold" opacity="0">&gt; (프롬프트) tech_deep_dive(topic='TTFB 최적화')
      <animate attributeName="opacity" from="0" to="1" begin="10.9s" dur="0.2s" fill="freeze"/></text>
    <text x="40" y="422" fill="#a6e3a1" opacity="0">→ "이윤선의 포트폴리오에서 'TTFB 최적화' 관련 경험을 깊게 조사해 주세요."
      <animate attributeName="opacity" from="0" to="1" begin="11.8s" dur="0.2s" fill="freeze"/></text>

    <text x="24" y="458" fill="#9399b2" opacity="0">$ <tspan fill="#cdd6f4">▌</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="12.8s" dur="0.2s" fill="freeze"/></text>
  </g>
</svg>
